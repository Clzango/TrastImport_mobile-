services:
  web:
    build:
      context: .
      args:
        # The app calls /api on its own origin; nginx forwards it to API_UPSTREAM.
        EXPO_PUBLIC_API_URL: /api
    image: trastimport-web
    environment:
      # Set API_UPSTREAM in your shell to use another backend,
      # e.g. http://host.docker.internal:8000 for the local Django container.
      API_UPSTREAM: ${API_UPSTREAM:-https://trastipmortapp-production.up.railway.app}
    ports:
      - "8080:80"
    restart: unless-stopped
