server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The web app calls the API through /api/ on its own origin, so the browser never
    # makes a cross-origin request and the API needs no CORS entry for this site.
    # /api/apps/companies/ -> ${API_UPSTREAM}/apps/companies/
    # (This file is an nginx template: ${API_UPSTREAM} is filled in from the environment.)
    location ^~ /api/ {
        proxy_pass ${API_UPSTREAM}/;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        client_max_body_size 10m;
    }

    # Hashed bundles and assets never change, so cache them for a long time.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Dynamic routes: expo export writes one page per route, e.g. company/[id].html.
    location ~ ^/(company|manage|claim|edit-company|reply)/[^/]+/?$ {
        try_files $uri "/$1/[id].html" =404;
    }
    location ~ ^/reset-password/[^/]+/[^/]+/?$ {
        try_files $uri "/reset-password/[uid]/[token].html" =404;
    }

    # Static routes: /login -> login.html, / -> index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /+not-found.html;
}
